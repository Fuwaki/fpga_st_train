[package]
name = "fpga_st_train"
version = "0.1.0"
edition = "2024"
description = "FPGA-friendly style transfer: MicroAST teacher inference + distillation training framework"

[features]
# Default training backend is CUDA (CubeCL on the NVIDIA driver).
# Vulkan is the AMD / non-CUDA fallback. wgpu is the WGSL path. Build one:
#   cargo run --release --no-default-features --features cuda
#   cargo run --release --no-default-features --features vulkan
#   cargo run --release --no-default-features --features ndarray
default = ["cuda", "ort-webgpu"]
cuda = ["burn/cuda"]
wgpu = ["burn/wgpu"]
vulkan = ["burn/wgpu", "burn/vulkan"]
# Pure-CPU fallback / correctness oracle: --no-default-features --features ndarray
ndarray = ["burn/ndarray", "ort/download-binaries", "ort/copy-dylibs"]
# WebGPU teacher, linked against the prebuilt ONNX Runtime (glibc 2.38).
ort-webgpu = ["ort/webgpu", "ort/download-binaries", "ort/copy-dylibs"]
# Load libonnxruntime.so at runtime via ORT_DYLIB_PATH. Used when the prebuilt
# binary does not link (Ubuntu 22.04 is glibc 2.35).
ort-dynamic = ["ort/load-dynamic"]
# CUDA execution provider for a machine with no AMD GPU. The published binary
# that matches this crate's ORT is the cuda13 + nvrtx + tensorrt set.
teacher-cuda = ["ort/cuda", "ort/nvrtx", "ort/tensorrt"]

[dependencies]
# --- deep learning ---
burn = { version = "0.21.0", features = ["train", "autodiff", "dataset", "std", "store"] }
burn-autodiff = "0.21.0"
burn-store = "0.21.0"
# --- errors / config ---
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
rmpv = { version = "1.3", features = ["with-serde"] }
# --- cli / logging ---
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
indicatif = "0.17"
# --- io / data ---
image = "0.25"
rayon = "1"
rand = "0.9"
hf-hub = { version = "0.4", default-features = false, features = ["native-tls", "ureq"] }
parquet = "55"
arrow = "55"
ureq = { version = "2", features = ["json"] }
# ONNX Runtime for the distillation teachers. WebGPU/Dawn/Vulkan targets the AMD GPU
# while training stays on CUDA. `ndarray` is how host tensors cross the boundary.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "tls-native", "api-31"] }
ash = "0.38"
ndarray = "0.17"
